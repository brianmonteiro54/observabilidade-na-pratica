# Collector no Kubernetes, em dois papéis:
#   agent (DaemonSet)   → recebe do app do próprio nó e lê o log dos contêineres
#   gateway (Deployment) → decide amostragem e exporta para Prometheus, Loki e Tempo
#
# Requer o OpenTelemetry Operator:
#   helm upgrade --install opentelemetry-operator \
#     open-telemetry/opentelemetry-operator -n observability \
#     --set manager.collectorImage.repository=otel/opentelemetry-collector-contrib
---
# O processor k8sattributes consulta a API do cluster. Sem este RBAC, o Collector
# sobe mas a telemetria chega sem os atributos k8s.*
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, nodes/stats, nodes/proxy]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  serviceAccount: otel-collector
  # permite a aplicação enviar para status.hostIP:4318 (o agent do próprio nó)
  hostNetwork: true
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 384Mi }

  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # centraliza o log de todos os contêineres do nó
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/observability_otel-*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
            add_metadata_from_filepath: true

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
      batch:
        timeout: 5s
        send_batch_size: 8192

    exporters:
      # o agent não fala com backend: só entrega ao gateway
      otlp/gateway:
        endpoint: otel-gateway-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2000
        retry_on_failure:
          enabled: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/gateway]
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  serviceAccount: otel-collector
  # Tail sampling exige todos os spans de um trace na MESMA instância.
  # Com 1 réplica isso é garantido; para escalar, use o exporter loadbalancing na frente.
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      resource:
        attributes:
          - key: deployment.environment
            value: prod
            action: upsert
      # nunca deixe dado pessoal sair do cluster
      attributes/redacao:
        actions:
          - key: user.email
            action: delete
          - key: http.request.header.authorization
            action: delete
      # 100% dos erros, 100% do que passou de 500 ms, 10% do resto
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        policies:
          - name: erro-sempre
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: lento-sempre
            type: latency
            latency:
              threshold_ms: 500
          - name: amostra-do-resto
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        timeout: 5s
        send_batch_size: 8192

    exporters:
      prometheusremotewrite:
        endpoint: http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write
        resource_to_telemetry_conversion:
          enabled: true
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
        tls:
          insecure: true
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes/redacao, tail_sampling, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes/redacao, batch]
          exporters: [otlphttp/loki]
