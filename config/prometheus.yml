# As métricas da aplicação chegam por remote write, enviadas pelo Collector.
# O scrape aqui serve para observar a própria stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # métricas internas do Collector: fila, itens recusados, falha de exportação
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
